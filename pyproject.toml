[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "life-product-extractor"
version = "0.1.0"
description = "CLI and API toolkit for auditable life insurance product extraction from Markdown to reviewed JSON."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ferryhe" }]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.scripts]
life-extract = "life_product_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
life_product_extractor = [
  "resources/schemas/*.json",
  "resources/examples/fixtures/*.yaml",
  "resources/examples/sources/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
