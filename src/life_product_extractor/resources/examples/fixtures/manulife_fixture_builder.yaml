    product_name: Manulife Universal Life
    relation: potentially_contradictory
    fixture_ids:
      - manulife_universal_life_page
      - manulife_universal_life_investment_accounts
    source_catalog_ids:
      - manulife_universal_life
      - manulife_ul_investment_account_table
    rationale: >
      The product page describes broad investment-account flexibility, while the
      supporting account table adds policy-series-specific availability limits.
      Later extraction and review stages should treat the pair as overlapping
      same-product evidence that may require reconciliation rather than blindly
      preferring one source.
